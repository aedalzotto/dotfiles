general {
    hide_cursor = true
}

auth {
    fingerprint {
        enabled = true
    }
}

background {
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

input-field {
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    # MD3 roles: primary (idle) / secondary (verifying) / error (fail)
    outer_color = rgba(d0bcffff)
    check_color = rgba(ccc2dcff)
    fail_color  = rgba(f2b8b5ff)

    font_color = rgb(230, 224, 233)   # MD3 on-surface
    fade_on_empty = false
    rounding = 16

    position = 0, -20
    halign = center
    valign = center
}

label {
    text = Hi there, $USER
    color = rgba(230, 224, 233, 1.0)   # MD3 on-surface
    font_size = 25
    font_family = Cantarell

    position = 0, 80
    halign = center
    valign = center
}
