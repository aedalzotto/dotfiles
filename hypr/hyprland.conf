$primary         = 0xffd0bcff
$outline         = 0xff938f99
$outline-variant = 0xee49454F

general {
    border_size = 2
    gaps_out = 10

    col.active_border   = $primary
    col.inactive_border = $outline

    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 15

    shadow {
        enabled = false
        color = $outline-variant
    }
    
    blur {
        enabled = false
        size = 3
        passes = 1
    }
}

animations {
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

misc {
    force_default_wallpaper = 0
}

dwindle {
    force_split = 2
    preserve_split = true # you probably want this
}

source = ~/.config/hypr/config.d/devices.conf
source = ~/.config/hypr/config.d/binds.conf
source = ~/.config/hypr/config.d/windowrules.conf
#source = ~/.config/hypr/config.d/xwaylandvideobridge.conf
