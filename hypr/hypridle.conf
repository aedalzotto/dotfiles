general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
	before_sleep_cmd = loginctl lock-session
}

# turn off keyboard backlight on idle. on-resume leaves it off while an external keyboard is
# plugged (flag set by /usr/local/bin/ext-kbd-backlight) so the two don't fight over the LED.
listener {
    timeout = 30
    on-timeout = light -s sysfs/leds/platform::kbd_backlight -S 0
    on-resume = test -e /run/ext-kbd-present || light -s sysfs/leds/platform::kbd_backlight -S 100
}

# dim the screen backlight on idle — but not while docked: the dock-controller owns eDP-1
# brightness then (flag = $XDG_RUNTIME_DIR/dock-saved-brightness), so the two don't fight.
listener {
    timeout = 60
    on-timeout = test -e "$XDG_RUNTIME_DIR/dock-saved-brightness" && exit; light -O && light -T 0.1
    on-resume = test -e "$XDG_RUNTIME_DIR/dock-saved-brightness" && exit; light -I
}

listener {
    timeout = 120
    on-timeout = loginctl lock-session && hyprctl dispatch dpms off && systemctl stop --user waybar
	on-resume = hyprctl dispatch dpms on && systemctl start --user waybar
}

listener {
	timeout = 300
	on-timeout = systemctl hibernate
}
